version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
