name: Git checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: git-policy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Git checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check new commit messages
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh script/check-commit-messages.sh "$BASE_SHA" "$HEAD_SHA"
      - name: Check Git hooks
        run: sh script/check-git.sh

  gate:
    name: Git policy
    needs: check
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all Git checks to pass
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: test "$CHECK_RESULT" = success
