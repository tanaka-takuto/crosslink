name: CLI checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# main pushはrunごとに分離する。同じgroupのpending置換で公開対象を失わない。
concurrency:
  group: cli-policy-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version policy
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout the checked SHA and base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Require valid and changed version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [ -n "$BASE_SHA" ]; then
            node script/check-version.ts --base "$BASE_SHA"
          else
            node script/check-version.ts
          fi

  check:
    name: CLI checks (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install pnpm
        run: npm install --global pnpm@12.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types, format, lint, tests, build and repository groups
        run: pnpm check

  binary:
    name: SEA checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up VFS-capable Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26.13.1"
      - name: Install pnpm
        run: npm install --global pnpm@12.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build standalone binary
        run: pnpm build:binary
      - name: Test standalone binary
        run: pnpm test:binary
      - name: Record actual platform, arch, version, SHA and hashes
        id: manifest
        run: node script/release.ts manifest tmp/bin
      - name: Preserve verified binaries from this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sea-${{ steps.manifest.outputs.target }}
          path: tmp/bin/*
          if-no-files-found: error
          retention-days: 14

  gate:
    name: CLI policy
    needs: [check, version, binary]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every CLI, version and SEA check
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          VERSION_RESULT: ${{ needs.version.result }}
          BINARY_RESULT: ${{ needs.binary.result }}
        run: test "$CHECK_RESULT" = success && test "$VERSION_RESULT" = success && test "$BINARY_RESULT" = success

  release-git:
    # 別workflowの完了通知へ依存せず、公開するSHAを同じrun内で検査する。
    name: Release Git checks (${{ matrix.os }})
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout exact source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Check new commit messages
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: sh script/check-commit-messages.sh "$BASE_SHA" "$HEAD_SHA"
      - name: Check Git hooks and policy
        run: sh script/check-git.sh

  release:
    name: Publish verified Release
    needs: [gate, release-git]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout the verified SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Download verified binaries from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sea-*
          merge-multiple: true
          path: tmp/release
      - name: Generate notes, verify draft assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node script/release.ts publish tmp/release
